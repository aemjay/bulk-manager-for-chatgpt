name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - run: npm test --prefix tests
