name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # Ein Release entsteht nur, wenn die E2E-Tests für genau diesen Commit grün sind.
  test:
    uses: ./.github/workflows/test.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Version prüfen
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} passt nicht zu manifest.json ($V)"; exit 1; }
      - name: Paket bauen
        id: build
        run: echo "zip=$(scripts/build-zip.sh)" >> "$GITHUB_OUTPUT"
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --title "$GITHUB_REF_NAME" --generate-notes
